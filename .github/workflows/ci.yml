name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    name: Windows build and test
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET 8
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore local tools
        run: dotnet tool restore

      - name: Restore locked dependencies
        run: dotnet restore EgressGuard.sln --locked-mode

      - name: Verify formatting
        run: dotnet format EgressGuard.sln --verify-no-changes --no-restore

      - name: Build Release
        run: dotnet build EgressGuard.sln -c Release --no-restore

      - name: Run executable test suite
        run: dotnet run --project tests\EgressGuard.Tests\EgressGuard.Tests.csproj -c Release --no-build

      - name: Audit vulnerable dependencies
        run: dotnet list EgressGuard.sln package --vulnerable --include-transitive
