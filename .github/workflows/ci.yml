name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Windows build and test
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      # dotnet-format locates the CLI through DOTNET_ROOT/DOTNET_HOST_PATH;
      # pinning both avoids the intermittent "Unable to locate dotnet CLI"
      # discovery flake on hosted runners.
      DOTNET_ROOT: 'C:\Program Files\dotnet'
      DOTNET_HOST_PATH: 'C:\Program Files\dotnet\dotnet.exe'

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET 8
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Run unified validation
        shell: powershell
        run: ./tools/Validate-EgressGuard.ps1 -RequireClean
