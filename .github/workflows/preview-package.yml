name: Preview package

on:
  pull_request:
    paths:
      - 'src/**'
      - 'Directory.Build.props'
      - 'EgressGuard.sln'
      - '**/packages.lock.json'
      - 'tools/Build-PreviewPackage.ps1'
      - '.github/workflows/preview-package.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: preview-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-smoke:
    name: Build portable preview and smoke test
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET 8
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x

      - name: Build preview package
        shell: powershell
        run: ./tools/Build-PreviewPackage.ps1 -OutputDirectory "$env:RUNNER_TEMP\preview out"

      - name: Upload extracted package contents as artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: EgressGuard-Preview-win-x64
          path: ${{ runner.temp }}\preview out\stage\
          if-no-files-found: error
          retention-days: 7

  verify-downloaded-artifact:
    name: Verify downloaded artifact and run launcher smoke test
    needs: build-and-smoke
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Download the artifact that was just uploaded
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: EgressGuard-Preview-win-x64
          path: ${{ runner.temp }}\artifact download

      - name: Extract exactly once into a path with spaces
        shell: powershell
        run: |
          $downloadDir = Join-Path $env:RUNNER_TEMP 'artifact download'
          $zip = Get-ChildItem $downloadDir -Filter '*.zip' -Recurse | Select-Object -First 1
          if ($zip) {
            $dest = Join-Path $env:RUNNER_TEMP 'Egress Guard Preview Dir With Spaces'
            Expand-Archive -LiteralPath $zip.FullName -DestinationPath $dest -Force
          }
          else {
            # The uploaded artifact already contains the extracted layout.
            $dest = $downloadDir
          }

          # download-artifact may nest the contents inside a folder named after
          # the artifact; locate the real package root before validating.
          $launcher = Get-ChildItem $dest -Filter 'EgressGuard.Launcher.exe' -Recurse |
            Select-Object -First 1
          if ($launcher) {
            $dest = $launcher.DirectoryName
          }
          else {
            Write-Host '::error::EgressGuard.Launcher.exe was not found in the downloaded artifact.'
            exit 1
          }

          foreach ($required in @(
            'service\EgressGuard.Service.exe',
            'ui\EgressGuard.UI.exe',
            'HUONG-DAN.txt',
            'commit-info.txt')) {
            $path = Join-Path $dest $required
            if (-not (Test-Path -LiteralPath $path)) {
              Write-Host "::error::missing in extracted package: $required"
              exit 1
            }
          }

          "PREVIEW_DEST=$dest" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "package ready at: $dest"

      - name: Start an unrelated canary process
        shell: powershell
        run: |
          $canary = Start-Process -FilePath "$env:ComSpec" -ArgumentList '/c', 'ping -n 300 127.0.0.1 > nul' -PassThru -WindowStyle Hidden
          "CANARY_PID=$($canary.Id)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "canary PID: $($canary.Id)"

      - name: Run the real launcher from the downloaded artifact
        shell: powershell
        env:
          EGRESSGUARD_LAUNCHER_SMOKE_EXIT_AFTER_SECONDS: '15'
        run: |
          $exe = Join-Path $env:PREVIEW_DEST 'EgressGuard.Launcher.exe'
          & $exe '--smoke-exit-after' '15'
          $code = $LASTEXITCODE
          Write-Host "launcher exit code: $code"
          if ($code -ne 0) {
            Write-Host "::error::launcher smoke test failed with exit code $code"
            exit 1
          }

      - name: Assert canary survived and owned processes are gone (finally cleans the canary)
        shell: powershell
        run: |
          try {
            Start-Sleep -Seconds 3
            $left = @(Get-Process -Name 'EgressGuard.Service','EgressGuard.UI','EgressGuard.Launcher' -ErrorAction SilentlyContinue)
            if ($left.Count -gt 0) {
              foreach ($process in $left) { Write-Host ("::error::leftover process: " + $process.Name + " pid=" + $process.Id) }
              exit 1
            }
            Write-Host 'no leftover service, UI or launcher processes.'

            $canaryPid = [int]$env:CANARY_PID
            $canary = Get-Process -Id $canaryPid -ErrorAction SilentlyContinue
            if ($null -eq $canary) {
              Write-Host '::error::the unrelated canary process was killed by mistake.'
              exit 1
            }
            Write-Host 'canary process is still alive, as required.'
          }
          finally {
            if ($env:CANARY_PID) {
              Stop-Process -Id ([int]$env:CANARY_PID) -Force -ErrorAction SilentlyContinue
              Write-Host 'canary cleaned up in finally.'
            }
          }